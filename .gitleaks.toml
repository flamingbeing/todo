# gitleaks: the default rules, except the Firebase web config (a public client id, not a secret: the Firestore rules
# decide who sees what; the key is restricted to this app's APIs and host), and the vendored Firebase hash list.
[extend]
useDefault = true

[allowlist]
description = "Firebase web config, vendored Firebase hashes, Web Push public key and published test vectors"
# app/src/vapid.js: the VAPID PUBLIC key (public by design; the private half is a Worker secret, never in the repo).
# worker/test/webpush.test.mjs: the example keys, salt and auth secret printed in RFC 8291 appendix A (public test data).
paths = ['''app/(src/)?config\.js''', '''tools/firebase\.lock\.json''', '''app/src/vapid\.js''', '''worker/test/webpush\.test\.mjs''']
